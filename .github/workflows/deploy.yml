name: Laravel Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/tailadmin-laravel:beta .

      - name: Login DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/tailadmin-laravel:beta

      - name: Run Container
        run: |
          docker rm -f tailadmin-laravel || true
          docker run -d -p 8090:80 --name tailadmin-laravel ${{ secrets.DOCKER_USERNAME }}/tailadmin-laravel:beta
