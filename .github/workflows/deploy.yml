name: Laravel CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t username_docker-tailadmin-laravel:beta .

      - name: Login DockerHub
        run: echo "${{ secrets.DOCKER_PASS }}" | docker login -u "${{ secrets.DOCKER_USER }}" --password-stdin

      - name: Push Image
        run: docker push username_docker-tailadmin-laravel:beta

      - name: Run Container
        run: |
          docker rm -f tailadmin-laravel || true
          docker run -d -p 8090:80 --name tailadmin-laravel username_docker-tailadmin-laravel:beta
